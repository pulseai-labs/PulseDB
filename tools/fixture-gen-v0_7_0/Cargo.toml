# Fixture generator for the REAL published pulsehive-db =0.7.0 (schema-v4) store
# carrying a persisted sync cursor (r1.s1.w1 / #9: the schema-v5 cursor split).
#
# ISOLATION (audit C9): this crate lives OUTSIDE the production cargo workspace.
# The empty [workspace] table below makes THIS Cargo.toml its own workspace root,
# so cargo never walks up into the production root manifest — the production root
# Cargo.toml is a single [package] with NO [workspace]/exclude and stays that way.
# Build only via an explicit `--manifest-path` (see README) so it never joins the
# production build/test graph.
[package]
name = "fixture-gen-v0_7_0"
version = "0.0.0"
edition = "2021"
publish = false

# Own workspace root — do NOT remove (isolation from the production crate).
[workspace]

[dependencies]
# Pinned EXACTLY to the published prior release so the generator resolves the
# real crates.io artifact (never a local path override). The `sync` feature is
# enabled so one in-memory sync persists a genuine schema-v4
# `SyncCursor { instance_id, last_sequence }` row — the record the v5 migration
# reshapes. No `builtin-embeddings` (no ONNX/ort); embeddings are injected as raw
# f32 vectors via the External embedding provider.
pulsehive-db = { version = "=0.7.0", features = ["sync"] }
serde_json = "1"
# redb is pinned to the SAME major the published crate resolves transitively
# (4.x), so we can re-open the frozen store read-only and dump the GENUINE
# on-disk raw bytes of the copy-through tables + the legacy sync cursor row as
# manifest ground truth (audit C4) — not a reconstruction.
redb = "4"
# Runtime for the one `SyncManager::sync_once` call (the sync API is async).
tokio = { version = "1", features = ["rt"] }
