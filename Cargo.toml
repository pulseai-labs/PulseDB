[package]
name = "pulsehive-db"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
authors = ["PulseDB Team"]
description = "Embedded database for agentic AI systems — collective memory for multi-agent coordination"
license = "AGPL-3.0-only"
repository = "https://github.com/pulseai-labs/PulseDB"
documentation = "https://docs.rs/pulsehive-db"
keywords = ["database", "embedded", "ai", "agents", "vector"]
categories = ["database", "embedded"]
readme = "README.md"

[lib]
name = "pulsedb"

[features]
default = []
builtin-embeddings = ["ort", "tokenizers", "ndarray", "dirs", "ureq"]
sync = ["tokio/time", "tokio/sync", "tokio/macros"]
sync-http = ["sync", "reqwest"]
sync-websocket = ["sync", "tokio-tungstenite"]
# VS-4.0.4 (#46): compiled-out migration crash-injection seam. OFF by default;
# enabled only for the `storage_migration_fault_injection` crash-recovery test.
fault-injection = ["dep:libc"]

[dependencies]
# Storage - redb is a pure Rust embedded KV store with ACID transactions
# Sprint 4.0 (VS-4.0.1 Hybrid co-resolution): bumped 2.1 -> 4.1. redb 4.x reads
# only file-format v3 and HARD-REFUSES the v2 files written by <=v0.5.1; the
# upgrade-on-open migration (VS-4.0.2) adds an aliased redb 2.6 to run
# Database::upgrade() (v2->v3) before opening under 4.x.
redb = "4.1"

# Aliased redb 2.6 — the ONLY v2->v3 file-format upgrade bridge (`Database::upgrade()`
# lives solely on the 2.6.x line; it is absent in 3.x/4.x). Used on the one-time
# upgrade-on-open migration path (`src/storage/redb.rs`) to rewrite a redb-v2 file to
# v3 in place, after which redb 4.1 reads it natively. VS-4.0.1/1.04 proved
# 2.6.3 + 4.1.0 co-resolve. `cargo-deny [bans] multiple-versions = "warn"` warns (not
# fails) on the dual-redb window — that is expected and tolerated (deny.toml).
redb_v2 = { package = "redb", version = "2.6" }

# Serialization - postcard (ADR-006, Accepted). The unmaintained bincode 1.x
# (RUSTSEC-2025-0141) was dropped in VS-4.0.3 once the vendored decode path
# (`storage::legacy_bincode`) + on-open value re-encode landed; the `deny.toml`
# advisory ignore was removed with it.
postcard = { version = "=1.1.3", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }

# IDs - UUID v7 provides time-ordered unique identifiers
uuid = { version = "1.0", features = ["v7", "serde"] }

# Error handling - thiserror derives Error trait with minimal boilerplate
thiserror = "1.0"

# Observability - tracing provides structured logging with spans
tracing = "0.1"

# Optional: only for the `fault-injection` feature's subprocess SIGKILL crash
# test (`libc::raise(SIGKILL)`). Never pulled in default/release builds.
libc = { version = "0.2", optional = true }

# Vector index - HNSW approximate nearest neighbor search (pure Rust, ADR-005)
hnsw_rs = "0.3"

# Distance metrics for HNSW (cosine, L2, etc.) - direct dep since we import DistCosine
anndists = "0.1"

# JSON serialization for HNSW metadata files (human-readable for debugging)
serde_json = "1.0"

# Cross-process watch - advisory file locking for writer detection
fs2 = "0.4"

# Watch system - bounded sync channels for in-process event delivery (<100ns per event)
crossbeam-channel = "0.5"

# Stream trait for async watch API (trait-only crate, no executor/runtime)
futures-core = "0.3"

# Efficient async waker integration for crossbeam→Stream bridge
atomic-waker = "1"

# Async trait support for SubstrateProvider (object-safe async traits)
async-trait = "0.1"

# Async runtime for spawn_blocking in SubstrateProvider wrappers
tokio = { version = "1", features = ["rt"] }

# Optional: ONNX runtime for builtin embedding generation
ort = { version = "2.0.0-rc.9", optional = true, features = ["ndarray"] }

# Optional: HuggingFace tokenizer for text preprocessing (WordPiece, BPE)
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }

# Optional: N-dimensional arrays for ONNX tensor construction (must match ort's ndarray version)
ndarray = { version = "0.17", optional = true }

# Optional: Cross-platform cache directory resolution
dirs = { version = "6.0", optional = true }

# Optional: HTTP client for model downloads from HuggingFace
ureq = { version = "3.0", optional = true }

# Optional: HTTP transport for sync protocol
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "gzip"] }

# Optional: WebSocket transport for sync protocol
tokio-tungstenite = { version = "0.29", optional = true }

[dev-dependencies]
# Testing utilities
tempfile = "3.0"

# Stream combinators for watch integration tests (StreamExt::next, block_on)
futures = "0.3"

# Async runtime for integration tests (multi-thread + macros for #[tokio::test])
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Axum for HTTP sync integration tests (server-side, dev only)
axum = "0.8"

# Benchmarking framework
criterion = { version = "0.5", features = ["html_reports"] }

# Property-based testing (E5-S03: verify invariants with random inputs)
proptest = "1.4"

# VS-4.0.4 (4.02) golden-fixture upgrade test only. Runtime deps are unchanged.
# sha2: the C1 provenance hash-check (fixture SHA-256 vs manifest) before opening.
sha2 = "0.10"
# serde_json: parse the frozen manifest oracle (already a runtime dep; re-declared
# here so the integration target can name it).
serde_json = "1.0"
# redb: re-open the MIGRATED store read-only to read GENUINE on-disk copy-through
# bytes (EMBEDDINGS + raw metadata keys) for the C4 RAW byte-identity assertion —
# pinned to the same 4.x the crate migrates INTO. Replaces the src/-side inspector
# that 4.04 was to add but did not (round-ordering gap; see report).
redb = "4.1"
# uuid: parse manifest id strings back into typed ids for by-id read-back lookups.
uuid = "1"

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "core_operations"
harness = false

[[bench]]
name = "workloads"
harness = false

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "recall_rerank"
harness = false

[[bench]]
name = "sync"
harness = false
required-features = ["sync"]

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
# Faster builds during development
opt-level = 0
debug = true

[profile.test]
# Match dev profile for consistent behavior
opt-level = 0
debug = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
